name: docker

# Build + publish Docker image to ghcr.io/mikefluff/skills.
#
# Triggers:
#   - on push to main → tag `latest` + commit SHA
#   - on tag v*       → also tag `vX.Y.Z`, `X.Y`, `X`, `latest`
#
# The image ships skills/writer/scripts/lint.py + all skills markdown.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/skills
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Mikefluff/skills
            org.opencontainers.image.description=Prose-editing Claude Code skills + offline writer linter
            org.opencontainers.image.source=https://github.com/Mikefluff/skills
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64 only — pulled image)
        run: |
          # Pull the just-pushed image and run a quick sanity check
          docker pull "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" version
          docker run --rm "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" list

      - name: Summary
        if: always()
        run: |
          {
            echo "## Docker image published"
            echo
            echo "Tags:"
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "Pull:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/skills"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
