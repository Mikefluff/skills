name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python (for writer linter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install jq
        run: sudo apt-get install -y jq

      - name: install runners deps (optional execution layer — imports-only check)
        run: pip install -r common/runners/requirements.txt

      - name: validate frontmatter + cross-links + description quality
        run: bash scripts/validate.sh

      - name: writer linter regression + fixture snapshots + AFTER samples + runners import
        run: bash scripts/smoke.sh

      - name: docs consistency (skills.json ↔ README ↔ USER-GUIDE ↔ walkthroughs)
        run: bash scripts/check-docs-consistency.sh

      - name: install.sh dry-run (local copy mode)
        run: bash install.sh --copy-from . --prefix /tmp/skills-ci --dry-run

      - name: install.sh full (local copy mode)
        run: |
          bash install.sh --copy-from . --prefix /tmp/skills-ci
          ls /tmp/skills-ci
          test -f /tmp/skills-ci/writer/SKILL.md
          test -f /tmp/skills-ci/.skills-collection.json

      - name: install.sh --list
        run: bash install.sh --copy-from . --list

      - name: install.sh --uninstall
        run: |
          bash install.sh --uninstall --prefix /tmp/skills-ci --yes
          test ! -f /tmp/skills-ci/.skills-collection.json
          test ! -d /tmp/skills-ci/writer

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        env:
          # SC2086: we intentionally rely on word splitting in several loops
          # SC1091: we don't follow externally-sourced scripts during static analysis
          SHELLCHECK_OPTS: -e SC2086 -e SC1091
        with:
          severity: error
          scandir: '.'
          additional_files: 'install.sh'

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            #node_modules/**
            #.git/**
